<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Generateur de cartes de deck</title>
<link href="https://unpkg.com/@saeris/typeface-beleren-bold@latest/index.css" rel="stylesheet" type="text/css">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Cormorant:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'EB Garamond', serif;
    background:#1c1c22;
    color:#eee;
    display:flex;
    align-items:flex-start;
  }
  h2{font-family:'Beleren2016', serif; margin:22px 0 14px; font-weight:normal; font-size:18px; color:#e3c789;}
  h2:first-child{margin-top:0;}

  .app{display:flex; width:100%; flex-wrap:wrap;}
  .controls{
    width:380px; flex:0 0 380px;
    background:#22222b;
    padding:22px;
    border-right:1px solid #3a3a45;
  }
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#a9a9b5; margin-bottom:5px;}
  .field input[type=text], .field select{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid #45454f;
    background:#181820; color:#eee; font-family:'EB Garamond',serif; font-size:15px;
  }
  .field .charcount{font-size:11px; color:#666; text-align:right; margin-top:2px;}
  .row2{display:flex; gap:8px;}
  .row2 > div{flex:1;}
  .btn{
    display:inline-block; padding:9px 14px; border-radius:6px; border:1px solid #b8934f;
    background:linear-gradient(180deg,#7a5b23,#4e3a17); color:#fff8e6;
    cursor:pointer; font-family:'EB Garamond',serif; font-size:14px; letter-spacing:.03em;
    width:100%; text-align:center;
  }
  .btn:hover{background:linear-gradient(180deg,#8a6a2b,#5c4720);}
  .btn.small{width:auto; padding:5px 9px; font-size:12px;}
  .divider{height:1px; background:#3a3a45; margin:18px 0;}

  .res-block{border:1px solid #3a3a45; border-radius:8px; padding:10px; margin-bottom:10px;}
  .res-block .miniLabel{font-size:11px; color:#a9a9b5; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}

  .colorCheckRow{display:flex; flex-wrap:wrap; gap:10px;}
  .colorCheck{display:flex; align-items:center; gap:5px; font-size:13px; color:#c9c9d2; cursor:pointer;}
  .colorCheck img{width:22px; height:22px;}

  .searchStatus{font-size:12px; color:#888; margin-top:6px;}

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 20px;
    gap:18px;
  }

  .cardViewport{
    width:651px;
    height:928.76px;
    overflow:hidden;
    position:relative;
  }
  .cardScale{
    width:1050px;
    height:1498px;
    transform:scale(0.62);
    transform-origin:top left;
  }

<body>
<div class="app">

  <div class="controls">
    <h2>1 - Titre &amp; commandant</h2>
    <div class="field">
      <label>Titre du deck</label>
      <input id="fTitle" type="text" value="The Sliver Swarm" maxlength="75">
      <div class="charcount" id="ccTitle"></div>
    </div>
    <div class="field">
      <label>Nom du commandant</label>
      <input id="fCommander" type="text" value="The First Sliver" maxlength="80">
      <div class="charcount" id="ccCommander"></div>
    </div>

    <h2>2 - Illustration</h2>
    <div class="field">
      <label>Fichier image</label>
      <input id="fArtFile" type="file" accept="image/*">
    </div>
    <div class="field">
      <label>Position horizontale</label>
      <input id="fArtX" type="range" min="0" max="100" value="50">
    </div>
    <div class="field">
      <label>Position verticale</label>
      <input id="fArtY" type="range" min="0" max="100" value="50">
    </div>
    <div class="field">
      <label>Zoom</label>
      <input id="fArtZoom" type="range" min="100" max="250" value="100">
    </div>

    <h2>3 - Couleurs</h2>
    <div class="field">
      <div class="colorCheckRow" id="colorCheckRow"></div>
    </div>

    <h2>4 - Roles du deck</h2>
    <div class="searchStatus" id="roleLibStatus">Chargement de la bibliotheque d'icones...</div>
    <div id="roleSlotsEditor"></div>

    <div class="divider"></div>
    <button class="btn" id="btnDownload">Telecharger cette carte (PNG)</button>
  </div>

  <div class="stage">
    <div class="cardViewport">
      <div class="cardScale">
        <div class="card">
          <div class="titleText" id="oTitlePreview"></div>
          <div class="artBox" id="artBoxPreview">
            <img id="oArtPreview" crossorigin="anonymous">
            <div class="artPlaceholder" id="oArtPlaceholderPreview">Choisis une illustration</div>
          </div>
          <div class="commanderText" id="oCommanderPreview"></div>
          <div class="colorsRow" id="oColorsPreview"></div>
          <div id="roleSlotsPreview"></div>
        </div>
      </div>
    </div>
    <div class="hint">On ajoutera les autres options une par une a partir d'ici.</div>
  </div>

</div>

<div style="position:absolute; left:-99999px; top:0;">
  <div class="card" id="cardCapture">
    <div class="titleText" id="oTitleCapture"></div>
    <div class="artBox" id="artBoxCapture">
      <img id="oArtCapture" crossorigin="anonymous">
      <div class="artPlaceholder" id="oArtPlaceholderCapture">Choisis une illustration</div>
    </div>
    <div class="commanderText" id="oCommanderCapture"></div>
    <div class="colorsRow" id="oColorsCapture"></div>
    <div id="roleSlotsCapture"></div>
  </div>

  {name:'sliver', url:'https://raw.githubusercontent.com/RenartWild/VisitCardMTG/main/ROLE/sliver.png'},
  {name:'swarm',  url:'https://raw.githubusercontent.com/RenartWild/VisitCardMTG/main/ROLE/swarm.png'},
  {name:'value',  url:'https://raw.githubusercontent.com/RenartWild/VisitCardMTG/main/ROLE/value.png'},
];   // {name, url} - seeded with the known files so the tool works even if
     // the live GitHub listing below can't be fetched (some browsers block
     // fetch() from a double-clicked local file). Successful fetches replace
     // this list with the live one, so newly added files still show up.
let roleSlots = [
  {icon:'sliver', title:'Tribal', subtitle:'Sliver'},
  {icon:'value', title:'Value', subtitle:'Synergie'},
  {icon:'swarm', title:'Swarm', subtitle:'Invasion'},
];

let artUrl = null;

// ---------- generic text fit ----------
function fitTextBox(box, baseSize, minSize, tightenOnWrap){
  let size = baseSize;
  box.style.lineHeight = '1.05';
  box.style.fontSize = size + 'px';
  while (size > minSize && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1)) {
    size -= 1;
    box.style.fontSize = size + 'px';
  }
  if (tightenOnWrap) {
    const singleLine = size * 1.05;
    if (box.scrollHeight > singleLine * 1.35) {
      size = Math.max(minSize, Math.round(size * 0.82));
      box.style.fontSize = size + 'px';
      box.style.lineHeight = '0.95';
      while (size > minSize && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1)) {
        size -= 1;
        box.style.fontSize = size + 'px';
      }
    }
  }
  return size;
}

// ---------- colors ----------
const colorCheckRow = document.getElementById('colorCheckRow');
COLORS.forEach(c=>{
  const label = document.createElement('label');
  label.className = 'colorCheck';
  label.innerHTML = `<input type="checkbox" ${activeColors.has(c.k)?'checked':''} data-k="${c.k}"><img src="${COLOR_ICON_DATA[c.icon]}">${c.label}`;
  colorCheckRow.appendChild(label);
});
colorCheckRow.querySelectorAll('input[type=checkbox]').forEach(cb=>{
  cb.addEventListener('change', e=>{
    const k = e.target.dataset.k;
    if(e.target.checked) activeColors.add(k); else activeColors.delete(k);
    render();
  });
});

function renderColors(){
  ['oColorsPreview','oColorsCapture'].forEach(id=>{
    const row = document.getElementById(id);
    row.innerHTML = '';
    COLORS.filter(c=>activeColors.has(c.k)).forEach(c=>{
      const img = document.createElement('img');
      img.src = COLOR_ICON_DATA[c.icon];
      img.crossOrigin = 'anonymous';
      row.appendChild(img);
    });
  });
}

// ---------- illustration ----------
document.getElementById('fArtFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{ artUrl = ev.target.result; applyArt(); };
  reader.readAsDataURL(file);
});
['fArtX','fArtY','fArtZoom'].forEach(id=>{
  document.getElementById(id).addEventListener('input', applyArt);
});

function applyArt(){
  const x = document.getElementById('fArtX').value;
  const y = document.getElementById('fArtY').value;
  const zoom = document.getElementById('fArtZoom').value;
  [['oArtPreview','oArtPlaceholderPreview'],['oArtCapture','oArtPlaceholderCapture']].forEach(([imgId,phId])=>{
    const img = document.getElementById(imgId);
    const ph = document.getElementById(phId);
    if(artUrl){
      img.src = artUrl;
      img.style.display = 'block';
      img.style.objectPosition = x + '% ' + y + '%';
      img.style.transform = 'scale(' + (zoom/100) + ')';
      img.style.transformOrigin = 'center';
      ph.style.display = 'none';
    } else {
      img.removeAttribute('src');
      img.style.display = 'none';
      ph.style.display = 'flex';
    }
  });
}

// ---------- role icon library (fixed public GitHub repo folder) ----------
// New icons can be added later just by dropping PNG/JPG/WEBP files into that
// GitHub folder (via github.com's web upload) - no edits needed here or in
// the interface. This source is intentionally not exposed as a setting.
const GH_OWNER = 'RenartWild';
const GH_REPO = 'VisitCardMTG';
const GH_PATH = 'ROLE';

async function loadGithubLibrary(){
  const status = document.getElementById('roleLibStatus');
  try{
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(GH_PATH)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('http ' + res.status);
    const items = await res.json();
    const imgExt = /\.(png|jpe?g|webp)$/i;
    const found = (Array.isArray(items) ? items : [])
      .filter(it=>it.type === 'file' && imgExt.test(it.name))
      .map(it=>({name: it.name.replace(/\.[^.]+$/,''), url: it.download_url}));
    if(found.length === 0){ status.textContent = 'Dossier ROLE vide ou introuvable.'; return; }
    roleIcons = found;
    buildRoleSlotsEditor();
    status.textContent = found.length + ' icone(s) chargee(s) : ' + found.map(f=>f.name).join(', ');
  }catch(e){
    status.textContent = "Bibliotheque indisponible (" + e.message + "). Si le fichier est ouvert en local (double-clic), certains navigateurs bloquent ce type de requete : essaie de le servir via un petit serveur local, ou ouvre-le avec un autre navigateur.";
    console.warn('Bibliotheque de roles indisponible:', e);
  }
}
loadGithubLibrary();

// ---------- role slots editor ----------
function buildRoleSlotsEditor(){
  const box = document.getElementById('roleSlotsEditor');
  box.innerHTML = '';
  roleSlots.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'res-block';
    const options = ['<option value="">-- Aucune icone --</option>']
      .concat(roleIcons.map(ic=>`<option value="${ic.name}" ${s.icon===ic.name?'selected':''}>${ic.name}</option>`))
      .join('');
    div.innerHTML = `
      <span class="miniLabel">Slot ${i+1}</span>
      <div class="field"><label>Icone</label><select data-i="${i}" class="rsIcon">${options}</select></div>
      <div class="field"><label>Titre du role</label><input data-i="${i}" class="rsTitle" type="text" maxlength="16" value="${s.title}"></div>
      <div class="field"><label>Specialisation du role</label><input data-i="${i}" class="rsSub" type="text" maxlength="24" value="${s.subtitle}"></div>
    `;
    box.appendChild(div);
  });
  box.querySelectorAll('.rsIcon').forEach(el=>el.onchange = e=>{ roleSlots[e.target.dataset.i].icon = e.target.value || null; render(); });
  box.querySelectorAll('.rsTitle').forEach(el=>el.oninput = e=>{ roleSlots[e.target.dataset.i].title = e.target.value; render(); });
  box.querySelectorAll('.rsSub').forEach(el=>el.oninput = e=>{ roleSlots[e.target.dataset.i].subtitle = e.target.value; render(); });
}
buildRoleSlotsEditor();

function buildRoleSlotDom(hostId, suffix){
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  for(let i=0;i<3;i++){
    const wrap = document.createElement('div');
    wrap.className = 'roleSlot';
    wrap.style.left = SLOT_LEFT[i] + 'px';
    wrap.style.width = SLOT_WIDTH[i] + 'px';
    wrap.innerHTML = `
      <div class="roleIconBox"><img class="roleIcon" id="roleIcon${suffix}${i}"></div>
      <div class="roleTextCol">
        <div class="roleTitle" id="roleTitle${suffix}${i}"></div>
        <div class="roleSub" id="roleSub${suffix}${i}"></div>
      </div>
    `;
    host.appendChild(wrap);
  }
}
buildRoleSlotDom('roleSlotsPreview', 'P');
buildRoleSlotDom('roleSlotsCapture', 'C');

function renderRoleSlots(){
  roleSlots.forEach((s,i)=>{
    const iconUrl = s.icon ? (roleIcons.find(ic=>ic.name===s.icon)||{}).url : null;
    ['P','C'].forEach(suffix=>{
      const icon = document.getElementById('roleIcon'+suffix+i);
      const title = document.getElementById('roleTitle'+suffix+i);
      const sub = document.getElementById('roleSub'+suffix+i);
      if(iconUrl){ icon.src = iconUrl; icon.style.visibility='visible'; icon.crossOrigin='anonymous'; }
      else { icon.removeAttribute('src'); icon.style.visibility='hidden'; }
      title.textContent = s.title;
      sub.textContent = s.subtitle;
      fitTextBox(title, 48, 16, true);
      fitTextBox(sub, 36, 12, true);
    });
  });
}

// ---------- main render ----------
function render(){
  const titleText = document.getElementById('fTitle').value;
  document.getElementById('ccTitle').textContent = titleText.length + ' / 75';
  const titlePreview = document.getElementById('oTitlePreview');
  const titleCapture = document.getElementById('oTitleCapture');
  titlePreview.textContent = titleText;
  titleCapture.textContent = titleText;
  const titleSize = fitTextBox(titleCapture, 48, 20, false);
  titlePreview.style.fontSize = titleSize + 'px';
  titlePreview.style.lineHeight = titleCapture.style.lineHeight;

  const commanderText = document.getElementById('fCommander').value;
  document.getElementById('ccCommander').textContent = commanderText.length + ' / 80';
  const commanderPreview = document.getElementById('oCommanderPreview');
  const commanderCapture = document.getElementById('oCommanderCapture');
  commanderPreview.textContent = commanderText;
  commanderCapture.textContent = commanderText;
  const commanderSize = fitTextBox(commanderCapture, 30, 14, true);
  commanderPreview.style.fontSize = commanderSize + 'px';
  commanderPreview.style.lineHeight = commanderCapture.style.lineHeight;

  renderColors();
  renderRoleSlots();
}
document.getElementById('fTitle').addEventListener('input', render);
document.getElementById('fCommander').addEventListener('input', render);
render();
applyArt();

document.getElementById('btnDownload').addEventListener('click', async ()=>{
  const node = document.getElementById('cardCapture');
  const canvas = await html2canvas(node, {backgroundColor:null, scale:1, useCORS:true});
  const link = document.createElement('a');
  const name = (document.getElementById('fTitle').value || 'carte-deck').replace(/[^a-z0-9]+/gi,'-');
  link.download = name + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
